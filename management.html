<!DOCTYPE html>
<html>
<head>
<title>Student Management System</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body{
font-family:Arial;
background:#f0f2f5;
margin:0;
padding:20px;
transition:0.3s;
}

.dark{
background:#121212;
color:white;
}

.container{
max-width:1000px;
margin:auto;
background:white;
padding:20px;
border-radius:10px;
box-shadow:0 0 10px rgba(0,0,0,0.1);
}

.dark .container{
background:#1e1e1e;
color:white;
}

h1{
text-align:center;
}

button{
padding:10px;
border:none;
background:#007bff;
color:white;
cursor:pointer;
margin:5px;
border-radius:5px;
}

button:hover{
background:#0056b3;
}

input{
width:100%;
padding:10px;
margin:5px 0;
box-sizing:border-box;
}

.stats{
display:flex;
gap:10px;
flex-wrap:wrap;
margin-bottom:20px;
}

.card{
flex:1;
background:#007bff;
color:white;
padding:15px;
border-radius:8px;
text-align:center;
}

table{
width:100%;
border-collapse:collapse;
margin-top:15px;
}

th,td{
border:1px solid #ddd;
padding:10px;
text-align:center;
}

th{
background:#007bff;
color:white;
}

.dark table{
background:#2a2a2a;
color:white;
}

@media(max-width:700px){
.stats{
flex-direction:column;
}
table{
font-size:12px;
}
}
</style>
</head>

<body>

<div class="container">

<h1>Student Management System</h1>

<button onclick="toggleDarkMode()">🌙 Dark Mode</button>

<div class="stats">

<div class="card">
<h3>Total Students</h3>
<h2 id="total">0</h2>
</div>

<div class="card">
<h3>Topper Marks</h3>
<h2 id="topper">0</h2>
</div>

</div>

<input type="text" id="id" placeholder="Student ID">
<input type="text" id="name" placeholder="Student Name">
<input type="text" id="course" placeholder="Course">
<input type="number" id="marks" placeholder="Marks">
<input type="number" id="attendance" placeholder="Attendance %">

<button onclick="addStudent()">Add Student</button>

<input type="text"
id="search"
placeholder="Search Student"
onkeyup="displayStudents()">

<table>

<thead>
<tr>
<th>ID</th>
<th>Name</th>
<th>Course</th>
<th>Marks</th>
<th>Grade</th>
<th>Attendance</th>
<th>Action</th>
</tr>
</thead>

<tbody id="table"></tbody>

</table>

</div>

<script>

let students=
JSON.parse(localStorage.getItem("students")) || [];

function grade(m){

if(m>=90) return "A+";
if(m>=80) return "A";
if(m>=70) return "B";
if(m>=60) return "C";
if(m>=50) return "D";

return "F";
}

function addStudent(){

let id=document.getElementById("id").value;
let name=document.getElementById("name").value;
let course=document.getElementById("course").value;
let marks=document.getElementById("marks").value;
let attendance=document.getElementById("attendance").value;

if(
id==""||
name==""||
course==""||
marks==""||
attendance==""
){
alert("Fill all fields");
return;
}

students.push({
id,
name,
course,
marks,
attendance
});

localStorage.setItem(
"students",
JSON.stringify(students)
);

document.getElementById("id").value="";
document.getElementById("name").value="";
document.getElementById("course").value="";
document.getElementById("marks").value="";
document.getElementById("attendance").value="";

displayStudents();
}

function deleteStudent(i){

students.splice(i,1);

localStorage.setItem(
"students",
JSON.stringify(students)
);

displayStudents();
}

function displayStudents(){

let search=
document.getElementById("search")
.value.toLowerCase();

let html="";

students.forEach((s,i)=>{

if(
s.name.toLowerCase().includes(search) ||
s.id.toLowerCase().includes(search)
){

html+=`
<tr>
<td>${s.id}</td>
<td>${s.name}</td>
<td>${s.course}</td>
<td>${s.marks}</td>
<td>${grade(Number(s.marks))}</td>
<td>${s.attendance}%</td>
<td>
<button onclick="deleteStudent(${i})">
Delete
</button>
</td>
</tr>
`;
}

});

document.getElementById("table").innerHTML=html;

document.getElementById("total")
.innerText=students.length;

if(students.length>0){

let top=Math.max(
...students.map(
s=>Number(s.marks)
)
);

document.getElementById("topper")
.innerText=top;
}
else{
document.getElementById("topper")
.innerText=0;
}
}

function toggleDarkMode(){
document.body.classList.toggle("dark");
}

displayStudents();

</script>

</body>
</html>
