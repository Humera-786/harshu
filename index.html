<!DOCTYPE html>
<html>
<head>
<title>Weather Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:linear-gradient(135deg,#74ebd5,#ACB6E5);
height:100vh;
display:flex;
justify-content:center;
align-items:center;
transition:0.3s;
}

.dark{
background:#121212;
}

.container{
width:90%;
max-width:400px;
background:white;
padding:25px;
border-radius:15px;
box-shadow:0 0 15px rgba(0,0,0,0.2);
text-align:center;
}

.dark .container{
background:#1e1e1e;
color:white;
}

h1{
margin-bottom:15px;
}

input{
width:100%;
padding:10px;
margin:10px 0;
border:1px solid #ccc;
border-radius:5px;
}

button{
padding:10px 15px;
border:none;
background:#007bff;
color:white;
border-radius:5px;
cursor:pointer;
margin:5px;
}

button:hover{
background:#0056b3;
}

.card{
margin-top:20px;
padding:15px;
background:#f4f4f4;
border-radius:10px;
}

.dark .card{
background:#333;
}

.temp{
font-size:35px;
font-weight:bold;
margin:10px 0;
}

.info{
margin:8px 0;
}
</style>
</head>

<body>

<div class="container">

<h1>🌤 Weather Dashboard</h1>

<input type="text" id="city" placeholder="Enter City">

<button onclick="showWeather()">Search</button>

<button onclick="toggleDark()">🌙 Dark Mode</button>

<div class="card">

<h2 id="cityName">Mysuru</h2>

<div class="temp" id="temp">28°C</div>

<div class="info" id="humidity">
Humidity: 65%
</div>

<div class="info" id="wind">
Wind: 10 km/h
</div>

<div class="info" id="condition">
Sunny
</div>

</div>

</div>

<script>

function toggleDark(){
document.body.classList.toggle("dark");
}

function showWeather(){

let city=
document.getElementById("city").value;

if(city==""){
alert("Enter city name");
return;
}

document.getElementById("cityName")
.innerText=city;

let temp=
Math.floor(Math.random()*15)+20;

let humidity=
Math.floor(Math.random()*40)+40;

let wind=
Math.floor(Math.random()*20)+5;

document.getElementById("temp")
.innerText=temp+"°C";

document.getElementById("humidity")
.innerText="Humidity: "+humidity+"%";

document.getElementById("wind")
.innerText="Wind: "+wind+" km/h";

let conditions=[
"Sunny",
"Cloudy",
"Rainy",
"Partly Cloudy"
];

document.getElementById("condition")
.innerText=
conditions[
Math.floor(
Math.random()*conditions.length
)
];

}

</script>

</body>
</html>
